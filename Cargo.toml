[package]
name = "bakery"
version = "0.2.0"
edition = "2021"
description = "Bake and run Tart-backed GitHub Actions runner VMs on a single macOS host"
license = "BSD-3-Clause"
repository = "https://github.com/Archdoog/bakery"

[[bin]]
name = "bakery"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
lto = "thin"
strip = true
