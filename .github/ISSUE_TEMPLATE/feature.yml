name: Feature request
description: Suggest a new capability or quality-of-life improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case first; the proposed solution is secondary.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Roughly what you'd like bakery to do. CLI shape, YAML surface, behavior — whichever fits.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've tried (or thought about) solving this. Helps us understand the design space.
